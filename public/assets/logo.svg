<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <!-- Vibrant gradients -->
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#2B1A4A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF7A00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark (Left Icon) -->
  <g transform="translate(6, 6)">
    <!-- Palette base circle / curve -->
    <path d="M 24 2 C 11.85 2 2 11.85 2 24 C 2 36.15 11.85 46 24 46 C 27.5 46 29.5 44 29.5 41.5 C 29.5 40.3 29 39.2 28.2 38.3 C 27.4 37.3 27 36.1 27 34.8 C 27 32 29.2 29.8 32 29.8 L 36.5 29.8 C 41.7 29.8 46 25.5 46 20.3 C 46 10.2 36.1 2 24 2 Z" fill="url(#purpleGrad)"/>
    
    <!-- Paint dab dots on palette -->
    <circle cx="14" cy="15" r="3.5" fill="#FF7A00" filter="url(#softGlow)"/>
    <circle cx="25" cy="11" r="3.5" fill="#FFD54F"/>
    <circle cx="34" cy="18" r="3.5" fill="#4DD0E1"/>
    <circle cx="14" cy="27" r="3.2" fill="#E040FB"/>
    
    <!-- Paintbrush angled across with paint tip -->
    <g transform="rotate(-32 24 24)">
      <!-- Brush handle -->
      <rect x="22" y="34" width="4.5" height="24" rx="2" fill="#FFE0B2"/>
      <!-- Ferrule (metal band) -->
      <rect x="21" y="27" width="6.5" height="7" rx="1.5" fill="#CFD8DC"/>
      <!-- Bristles -->
      <path d="M 21 27 C 21 20 24.2 14 24.2 14 C 24.2 14 27.5 20 27.5 27 Z" fill="url(#brushGrad)"/>
      <!-- Paint tip dab -->
      <circle cx="24.2" cy="14" r="2.2" fill="#FFF"/>
    </g>
  </g>

  <!-- Wordmark "Art School" -->
  <text x="64" y="32" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Art School</text>
  <text x="65" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FF7A00" letter-spacing="2.8" text-transform="uppercase">FINE ARTS STUDIO</text>
</svg>
